<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand fw-bold">
            🎓 Student Assessment System
        </span>
    </div>
</nav>

<div class="container my-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Student Registration Form</h3>
        </div>

        <div class="card-body">

            <form action="/save_student" method="POST">

                <!-- Personal Information -->
                <h5 class="text-primary mb-3">Personal Information</h5>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Register Number</label>
                        <input type="text" name="register_no"
                               class="form-control"
                               placeholder="24UAM001"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Student Name</label>
                        <input type="text" name="student_name"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Gender</label>
                        <select name="gender" class="form-select">
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" name="dob"
                               class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Student Contact</label>
                        <input type="text" name="student_contact"
                               class="form-control">
                    </div>

                </div>

                <hr class="my-4">

                <!-- Parent Information -->
                <h5 class="text-primary mb-3">Parent Information</h5>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Father Name</label>
                        <input type="text" name="father_name"
                               class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Father Contact</label>
                        <input type="text" name="father_contact"
                               class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Mother Name</label>
                        <input type="text" name="mother_name"
                               class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Mother Contact</label>
                        <input type="text" name="mother_contact"
                               class="form-control">
                    </div>

                </div>

                <hr class="my-4">

                <!-- Address -->
                <h5 class="text-primary mb-3">Address Information</h5>

                <div class="row g-3">

                    <div class="col-12">
                        <label class="form-label">Student Address</label>
                        <textarea name="student_address"
                                  class="form-control"
                                  rows="2"></textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label">School Address</label>
                        <textarea name="school_address"
                                  class="form-control"
                                  rows="2"></textarea>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Taluk</label>
                        <input type="text" name="taluk"
                               class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">District</label>
                        <input type="text" name="district"
                               class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Caste</label>
                        <input type="text" name="caste"
                               class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Community</label>
                        <input type="text" name="community"
                               class="form-control">
                    </div>

                </div>

                <hr class="my-4">

                <!-- Educational Information -->
                <h5 class="text-primary mb-3">Educational Information</h5>

                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label">12th Mark</label>
                        <input type="text" name="twelth_mark"
                               class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Medium 6 to 12</label>
                        <select name="medium" class="form-select">
                            <option value="">Select Medium</option>
                            <option>Tamil</option>
                            <option>English</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Pudhumai Penn Scheme</label>
                        <select name="pudhumai_penn" class="form-select">
                            <option value="">Select</option>
                            <option>Eligible</option>
                            <option>Not Eligible</option>
                        </select>
                    </div>

                </div>

                <!-- Submit -->
                <div class="text-center mt-5">

                    <button type="submit"
                            class="btn btn-primary btn-lg px-5">
                        Submit & Save Student
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>

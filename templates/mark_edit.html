<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Academic Marks</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">
            <h3 class="mb-0">✏️ Edit Academic Marks</h3>
        </div>

        <div class="card-body">

            <form
                action="{{ url_for('update_academic_marks', mark_id=mark['id']) }}"
                method="POST"
            >

                <!-- Register Number -->
                <div class="mb-3">
                    <label class="form-label">
                        <strong>Register Number</strong>
                    </label>

                    <input
                        type="text"
                        name="register_no"
                        class="form-control"
                        value="{{ mark['register_no'] }}"
                        required
                    >
                </div>


                <!-- Semester -->
                <div class="mb-3">
                    <label class="form-label">
                        <strong>Semester</strong>
                    </label>

                    <select
                        name="semester"
                        class="form-select"
                        required
                    >

                        <option value="1"
                            {% if mark['semester'] == 1 %}selected{% endif %}>
                            Semester 1
                        </option>

                        <option value="2"
                            {% if mark['semester'] == 2 %}selected{% endif %}>
                            Semester 2
                        </option>

                        <option value="3"
                            {% if mark['semester'] == 3 %}selected{% endif %}>
                            Semester 3
                        </option>

                        <option value="4"
                            {% if mark['semester'] == 4 %}selected{% endif %}>
                            Semester 4
                        </option>

                        <option value="5"
                            {% if mark['semester'] == 5 %}selected{% endif %}>
                            Semester 5
                        </option>

                        <option value="6"
                            {% if mark['semester'] == 6 %}selected{% endif %}>
                            Semester 6
                        </option>

                    </select>
                </div>


                <!-- Subject Code -->
                <div class="mb-3">
                    <label class="form-label">
                        <strong>Subject Code</strong>
                    </label>

                    <input
                        type="text"
                        name="subject_code"
                        class="form-control"
                        value="{{ mark['subject_code'] }}"
                        required
                    >
                </div>


                <!-- Subject Name -->
                <div class="mb-3">
                    <label class="form-label">
                        <strong>Subject Name</strong>
                    </label>

                    <input
                        type="text"
                        name="subject_name"
                        class="form-control"
                        value="{{ mark['subject_name'] }}"
                        required
                    >
                </div>


                <!-- CIA 1 -->
                <div class="mb-3">
                    <label class="form-label">
                        <strong>CIA-1 Mark</strong>
                    </label>

                    <input
                        type="number"
                        name="cia1"
                        class="form-control"
                        value="{{ mark['cia1'] }}"
                        min="0"
                        required
                    >
                </div>


                <!-- CIA 2 -->
                <div class="mb-3">
                    <label class="form-label">
                        <strong>CIA-2 Mark</strong>
                    </label>

                    <input
                        type="number"
                        name="cia2"
                        class="form-control"
                        value="{{ mark['cia2'] }}"
                        min="0"
                        required
                    >
                </div>


                <!-- Model Exam -->
                <div class="mb-3">
                    <label class="form-label">
                        <strong>Model Exam Mark</strong>
                    </label>

                    <input
                        type="number"
                        name="model_mark"
                        class="form-control"
                        value="{{ mark['model_mark'] }}"
                        min="0"
                        required
                    >
                </div>


                <!-- Attendance -->
                <div class="mb-3">
                    <label class="form-label">
                        <strong>Attendance (%)</strong>
                    </label>

                    <input
                        type="text"
                        name="attendance"
                        class="form-control"
                        value="{{ mark['attendance'] }}"
                        required
                    >
                </div>


                <!-- Semester Exam -->
                <div class="mb-4">
                    <label class="form-label">
                        <strong>Semester Exam Mark</strong>
                    </label>

                    <input
                        type="number"
                        name="semester_exam"
                        class="form-control"
                        value="{{ mark['semester_exam'] }}"
                        min="0"
                        required
                    >
                </div>


                <!-- Buttons -->
                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        💾 Update Marks
                    </button>

                    <a
                        href="{{ url_for('view_marks', register_no=mark['register_no']) }}"
                        class="btn btn-secondary"
                    >
                        ← Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>

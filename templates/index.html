<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

```
<title>Student CIA Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
```

</head>

<body class="bg-light">

```
<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow border-0">

                <div class="card-header bg-primary text-white text-center p-4">

                    <h2 class="mb-1">
                        🎓 Student CIA Management System
                    </h2>

                    <p class="mb-0">
                        Search Student Academic Record
                    </p>

                </div>

                <div class="card-body p-4">

                    <h4 class="text-center mb-4">
                        Enter Student Register Number
                    </h4>

                    <form action="{{ url_for('search') }}" method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                <strong>Register Number</strong>
                            </label>

                            <input type="text"
                                   name="register_no"
                                   class="form-control form-control-lg"
                                   placeholder="Example: 24UAM001"
                                   required>

                        </div>

                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-primary btn-lg">

                                🔍 Search Student

                            </button>

                        </div>

                    </form>

                    <hr>

                    <div class="text-center">

                        <a href="{{ url_for('add_student') }}"
                           class="btn btn-success me-2">

                            ➕ Add Student

                        </a>

                        <a href="{{ url_for('students') }}"
                           class="btn btn-dark">

                            📋 Saved Students

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
```

</body>
</html>
